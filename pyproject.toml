[project]
name = "floorplan"
version = "0.1.0"
description = "Phone captures (photos, video, LiDAR) to dimensioned, stitched floor plans"
readme = "README.md"
authors = [
    { name = "Aman Tibrewal", email = "amantibrewal310@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pycolmap>=4.2.0",
    "trimesh>=5.1.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
floorplan = "floorplan.cli:main"

[tool.pytest.ini_options]
markers = ["slow: runs structure-from-motion (about a minute)"]
