[project]
name = "floorplan"
version = "0.1.0"
description = "Phone captures (photos, video, LiDAR) to dimensioned, stitched floor plans"
readme = "README.md"
authors = [
    { name = "Aman Tibrewal", email = "amantibrewal310@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mapanything",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.10.0.84",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "trimesh>=5.1.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[project.scripts]
floorplan = "floorplan.cli:main"

[tool.pytest.ini_options]
markers = ["slow: runs structure-from-motion (about a minute)"]

[tool.uv.sources]
mapanything = { git = "https://github.com/facebookresearch/map-anything", rev = "3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9" }
